<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Activate Technician Account - Recomputech</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4">

                        <div class="text-center mb-4">

                            <h2 class="fw-bold">
                                Activate Your Account
                            </h2>

                            <p class="text-muted">
                                Create your password to access
                                your Recomputech technician account.
                            </p>

                        </div>


                        <div
                            id="activationMessage"
                            class="alert d-none"
                        ></div>


                        <form id="activationForm">

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    New Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    minlength="8"
                                    required
                                >

                                <small class="text-muted">
                                    Password must contain at least 8 characters.
                                </small>

                            </div>


                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label"
                                >
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    minlength="8"
                                    required
                                >

                            </div>


                            <button
                                type="submit"
                                id="activateBtn"
                                class="btn btn-primary w-100"
                            >
                                Activate Account
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase-config.js"></script>

    <script src="../js/supabase-client.js"></script>

    <script src="technician-activate.js"></script>

</body>

</html>
